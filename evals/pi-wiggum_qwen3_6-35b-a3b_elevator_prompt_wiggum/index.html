<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator Simulation</title>
    <style>
        body { margin: 0; background: #1a1a2e; overflow: hidden; }
        canvas { display: block; }
        #speed-control { position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif; z-index: 10; }
    </style>
</head>
<body>
    <div id="speed-control">
        <label for="speed-slider">Speed: <span id="speed-label">1</span>x</label>
        <input type="range" id="speed-slider" min="1" max="20" value="1" step="1">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
