<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { display: block; }
        #speed-control {
            position: absolute; top: 10px; left: 10px;
            color: white; font-family: sans-serif; font-size: 14px;
            background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px;
        }
        #speed-control label { margin-right: 8px; }
        #speed-value { margin-left: 8px; }
    </style>
</head>
<body>
    <div id="speed-control">
        <label for="speed-slider">Speed</label>
        <input type="range" id="speed-slider" min="1" max="20" value="1">
        <span id="speed-value">1x</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
