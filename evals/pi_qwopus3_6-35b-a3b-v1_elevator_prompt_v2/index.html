<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elevator Simulation - Three.js</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #speed-control {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 12px 18px;
            border-radius: 8px;
            color: #fff;
        }
        #speed-control label { font-size: 14px; margin-right: 8px; }
        #speed-slider { width: 120px; vertical-align: middle; }
        #speed-value { display: inline-block; min-width: 35px; text-align: right; margin-left: 6px; font-weight: bold; color: #ffff00; }
    </style>
</head>
<body>
    <div id="speed-control">
        <label for="speed-slider">Speed:</label>
        <input type="range" id="speed-slider" min="1" max="20" value="5" oninput="updateSpeed(this.value)">
        <span id="speed-value">5x</span>
    </div>

    <!-- 1. Load the core Three.js library first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- 2. Load OrbitControls, which depends on the core library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 3. Load custom scripts last -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>

    <script>
        // Global speed multiplier reference for the slider
        var simulationSpeed = 5;
        function updateSpeed(value) {
            simulationSpeed = parseInt(value, 10);
            document.getElementById('speed-value').textContent = value + 'x';
        }
    </script>
</body>
</html>
