<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Elevator Simulation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:#20242a;font-family:sans-serif;}
#ui{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.6);color:#fff;padding:12px 16px;border-radius:8px;z-index:10;}
#ui label{font-size:13px;}
#speedSlider{width:140px;vertical-align:middle;margin:0 6px;}
#speedLabel{display:inline-block;min-width:36px;text-align:center;font-weight:bold;}
</style>
</head>
<body>
<div id="ui">
<label>Speed: <input type="range" id="speedSlider" min="1" max="20" value="1" step="1"><span id="speedLabel">1x</span></label>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="person.js"></script>
<script src="elevator.js"></script>
</body>
</html>
