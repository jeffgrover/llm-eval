<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            background: #444;
            color: white;
            border: 1px solid #666;
            border-radius: 4px;
        }
        button:hover { background: #666; }
        .status { font-weight: bold; color: #00ffcc; }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Elevator Sim</h2>
        <div>Status: <span id="status" class="status">Idle</span></div>
        <div>Current Floor: <span id="floor-display" class="status">1</span></div>
        <div>Passengers: <span id="passenger-count" class="status">0</span></div>
    </div>
    <div id="controls">
        <strong>Call Elevator to Floor:</strong><br>
        <button onclick="requestFloor(0)">1</button>
        <button onclick="requestFloor(1)">2</button>
        <button onclick="requestFloor(2)">3</button>
        <button onclick="requestFloor(3)">4</button>
        <button onclick="requestFloor(4)">5</button>
        <button onclick="requestFloor(5)">6</button>
    </div>

    <!-- Load Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const FLOOR_COUNT = 6;
        const FLOOR_HEIGHT = 4;
        const ELEVATOR_SPEED = 0.1;
        const COLORS = {
            building: 0xcccccc,
            elevator: 0xffcc00,
            person: 0x00ffaa,
            floor: 0x888888
        };

        // --- State ---
        let currentFloor = 0;
        let targetFloor = 0;
        let isMoving = false;
        let passengers = [];
        const queue = [];

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222233);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 10, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- Building Construction ---
        const buildingGroup = new THREE.Group();
        
        // Floors
        for (let i = 0; i < FLOOR_COUNT; i++) {
            const floorGeo = new THREE.BoxGeometry(10, 0.2, 10);
            const floorMat = new THREE.MeshPhongMaterial({ color: COLORS.floor });
            const floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.position.y = i * FLOOR_HEIGHT;
            floorMesh.receiveShadow = true;
            buildingGroup.add(floorMesh);

            // Walls (simplified)
            const wallGeo = new THREE.BoxGeometry(0.2, FLOOR_HEIGHT, 10);
            const wallMat = new THREE.MeshPhongMaterial({ color: COLORS.building, transparent: true, opacity: 0.3 });
            const leftWall = new THREE.Mesh(wallGeo, wallMat);
            leftWall.position.set(-5, i * FLOOR_HEIGHT + FLOOR_HEIGHT/2, 0);
            buildingGroup.add(leftWall);

            const rightWall = new THREE.Mesh(wallGeo, wallMat);
            rightWall.position.set(5, i * FLOOR_HEIGHT + FLOOR_HEIGHT/2, 0);
            buildingGroup.add(rightWall);
        }
        scene.add(buildingGroup);

        // Elevator Shaft / Car
        const elevatorGeo = new THREE.BoxGeometry(2, 3.8, 2);
        const elevatorMat = new THREE.MeshPhongMaterial({ color: COLORS.elevator });
        const elevatorCar = new THREE.Mesh(elevatorGeo, elevatorMat);
        elevatorCar.castShadow = true;
        elevatorCar.position.set(0, 0, 0);
        scene.add(elevatorCar);

        // --- People Logic ---
        function createPerson() {
            const personGeo = new THREE.CapsuleGeometry(0.2, 0.6, 4, 8);
            const personMat = new THREE.MeshPhongMaterial({ color: COLORS.person });
            const person = new THREE.Mesh(personGeo, personMat);
            
            // Random floor
            const startFloor = Math.floor(Math.random() * FLOOR_COUNT);
            const targetFloor = Math.floor(Math.random() * FLOOR_COUNT);
            while (targetFloor === startFloor) {
                targetFloor = Math.floor(Math.random() * FLOOR_COUNT);
            }

            person.position.set(
                (Math.random() - 0.5) * 4, 
                startFloor * FLOOR_HEIGHT + 0.5, 
                (Math.random() - 0.5) * 4
            );
            
            return { mesh: person, startFloor, targetFloor, state: 'waiting' };
        }

        function spawnPerson() {
            const p = createPerson();
            scene.add(p.mesh);
            passengers.push(p);
        }

        // Spawn a few people initially
        for (let i = 0; i < 5; i++) spawnPerson();
        setInterval(spawnPerson, 8000); // New person every 8 seconds

        // --- Global Functions for UI ---
        window.requestFloor = function(floor) {
            queue.push(floor);
            updateUI();
        };

        function updateUI() {
            document.getElementById('status').innerText = isMoving ? 'Moving' : 'Idle';
            document.getElementById('floor-display').innerText = currentFloor + 1;
            document.getElementById('passenger-count').innerText = passengers.filter(p => p.state === 'riding').length;
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Elevator Movement Logic
            if (!isMoving && queue.length > 0) {
                targetFloor = queue.shift();
                isMoving = true;
            }

            if (isMoving) {
                const targetY = targetFloor * FLOOR_HEIGHT;
                const currentY = elevatorCar.position.y;
                const diff = targetY - currentY;

                if (Math.abs(diff) < 0.1) {
                    elevatorCar.position.y = targetY;
                    isMoving = false;
                    currentFloor = targetFloor;
                    updateUI();
                } else {
                    elevatorCar.position.y += Math.sign(diff) * ELEVATOR_SPEED;
                }
            }

            // Passenger Logic
            passengers.forEach((p, index) => {
                if (p.state === 'waiting' && currentFloor === p.startFloor && !isMoving) {
                    // Enter elevator if it's at their floor and not moving
                    p.state = 'riding';
                    p.mesh.position.set(0, currentFloor * FLOOR_HEIGHT + 0.5, 0);
                } else if (p.state === 'riding') {
                    // Follow elevator car
                    p.mesh.position.y = elevatorCar.position.y + 0.5;
                    
                    if (!isMoving && currentFloor === p.targetFloor) {
                        // Exit elevator
                        p.state = 'exited';
                        p.mesh.position.x += (Math.random() - 0.5) * 2;
                        p.mesh.position.z += (Math.random() - 0.5) * 2;
                        // Remove person after a delay to simulate leaving building
                        setTimeout(() => {
                            scene.remove(p.mesh);
                            passengers.splice(passengers.indexOf(p), 1);
                        }, 3000);
                    }
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
