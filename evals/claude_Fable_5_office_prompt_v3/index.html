<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Office Building Simulation</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#222233}canvas{display:block}
#hud{position:fixed;top:10px;left:10px;z-index:10;background:rgba(10,12,20,0.78);color:#dde4f0;
font-family:Menlo,Consolas,monospace;font-size:12px;padding:10px 14px;border-radius:8px;
border:1px solid rgba(140,160,220,0.35);min-width:250px;user-select:none}
#hud .clock{font-size:26px;font-weight:bold;color:#ffd766;letter-spacing:1px;margin-bottom:6px}
#hud label{display:block;margin-top:8px;color:#9fb0d0}
#hud input[type=range]{width:100%}
#hud .stats{margin-top:8px;white-space:pre;line-height:1.5;color:#b8c4dd}
</style>
</head><body>
<div id="hud">
  <div class="clock" id="hudClock">--:--</div>
  <label>Speed: <span id="speedLabel">120x</span></label>
  <input type="range" id="speedSlider" min="0" max="100" value="75" step="1">
  <label>Occupancy: <span id="occLabel">45 / 100 people</span></label>
  <input type="range" id="occSlider" min="1" max="100" value="45" step="1">
  <div class="stats" id="hudStats"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="person.js"></script>
<script src="world.js"></script>
<script src="elevator_logic.js"></script>
<script src="elevator.js"></script>
<script src="sim.js"></script>
</body></html>
