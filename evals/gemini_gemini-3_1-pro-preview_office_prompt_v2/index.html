<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Office Building Simulation</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#222233;font-family:sans-serif}canvas{display:block}
#ui{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);color:white;padding:15px;border-radius:5px;pointer-events:none;min-width:250px;}
#ui input, #ui label{pointer-events:auto;font-size:14px;}
.ui-row{margin-bottom:10px;}
</style>
</head><body>
<div id="ui">
  <div style="font-size:24px;font-weight:bold;margin-bottom:15px;" id="timeDisplay"> 9:24 AM</div>
  <div class="ui-row">
    <label>Speed: <span id="speedVal">120x</span></label><br>
    <input type="range" id="speedSlider" min="0" max="1" step="0.01" value="0.778" style="width:100%">
  </div>
  <div class="ui-row">
    <label>Occupancy: <span id="occVal">45</span> / 100</label><br>
    <input type="range" id="occSlider" min="1" max="100" step="1" value="45" style="width:100%">
  </div>
  <div id="stateBreakdown" style="font-size:12px;margin-top:10px;white-space:pre-wrap;"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="person.js"></script>
<script src="world.js"></script>
<script src="elevator_logic.js"></script>
<script src="elevator.js"></script>
<script src="sim.js"></script>
</body></html>
