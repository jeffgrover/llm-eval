<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D Elevator Simulation</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #20242a; }
  #speed-control {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    padding: 8px 12px;
    background: rgba(15, 18, 24, 0.75);
    color: #e8ecf2;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 8px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #speed-control input[type="range"] { width: 160px; }
</style>
</head>
<body>
<div id="speed-control">
  <label for="speed-slider">Speed</label>
  <input id="speed-slider" type="range" min="1" max="20" step="1" value="1">
  <span id="speed-value">1x</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="person.js"></script>
<script src="elevator.js"></script>
</body>
</html>
