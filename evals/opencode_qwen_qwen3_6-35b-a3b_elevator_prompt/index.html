<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Elevator Simulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #controls {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            z-index: 100;
            user-select: none;
        }
        #controls h3 { margin-bottom: 10px; font-size: 16px; }
        #controls label { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        #speedSlider { width: 150px; cursor: pointer; }
        #speedValue { min-width: 40px; text-align: right; }
        #status {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 100;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>Elevator Simulation</h3>
        <label>
            Speed:
            <input type="range" id="speedSlider" min="1" max="20" value="5" step="1">
            <span id="speedValue">5x</span>
        </label>
    </div>
    <div id="status">Initializing...</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
