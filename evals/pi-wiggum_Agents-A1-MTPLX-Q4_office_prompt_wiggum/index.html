<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Office Building Simulation</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#222233}canvas{display:block}#hud{position:absolute;top:10px;left:10px;color:#ffffff;font-family:monospace;font-size:14px;z-index:100}</style>
</head><body>
<div id="hud">Sim Time: <span id="simTime">--:--</span></div>
<script>
window.onerror = function(message, source, lineno, colno, error) {
    console.error('Page Error: ' + message);
    if (error && error.stack) {
        console.error('Stack:', error.stack);
    }
    return false;
};
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

<script src="world.js"></script>
<script src="elevator_logic.js"></script>
<script src="elevator.js"></script>
<script src="sim.js"></script>
</body></html>
