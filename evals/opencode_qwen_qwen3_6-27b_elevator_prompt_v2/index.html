<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #speed-control {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            z-index: 100;
        }
        #speed-control label { margin-right: 10px; }
        #speed-slider { width: 150px; vertical-align: middle; }
        #speed-value { margin-left: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="speed-control">
        <label for="speed-slider">Speed:</label>
        <input type="range" id="speed-slider" min="1" max="20" value="1">
        <span id="speed-value">1x</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
