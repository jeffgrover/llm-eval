<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elevator Simulation</title>
    <style>
        body { margin: 0; background: #1a1a2e; overflow: hidden; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif; z-index: 10; }
        label { margin-right: 5px; }
    </style>
</head>
<body>
<div id="ui">
    <label for="speedSlider"><b>Speed</b></label><br>
    <input type="range" id="speedSlider" min="1" max="20" value="1" step="1">
    <span id="speedDisplay">1x</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="person.js"></script>
<script src="elevator.js"></script>
</body>
</html>
