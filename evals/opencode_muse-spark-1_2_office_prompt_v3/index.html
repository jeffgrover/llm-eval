<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Office Building Simulation</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#222233}canvas{display:block}#hud{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.65);color:#fff;font-family:monospace;padding:10px;border-radius:6px;min-width:240px;font-size:12px}#hud label{display:block;margin:6px 0}</style>
</head><body>
<div id="hud">
<div id="clockDisplay" style="font-size:18px;font-weight:bold">07:30 AM</div>
<label>Speed: <input id="speedSlider" type="range" min="0" max="6" value="3" step="1"> <span id="speedVal">120x</span></label>
<label>Occupancy: <input id="occSlider" type="range" min="1" max="100" value="45"> <span id="occVal">45 / 100</span></label>
<div id="stats"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="person.js"></script>
<script src="world.js"></script>
<script src="elevator_logic.js"></script>
<script src="elevator.js"></script>
<script src="sim.js"></script>
</body></html>
