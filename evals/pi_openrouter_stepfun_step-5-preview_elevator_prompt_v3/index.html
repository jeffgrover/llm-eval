<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three.js Elevator Simulation - 6 Floor Building</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #20242a;
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    canvas {
        display: block;
    }

    #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 10;
        min-width: 240px;
        padding: 12px 16px;
        border-radius: 10px;
        background: rgba(12, 16, 22, 0.72);
        color: #f2f4f7;
        font-size: 13px;
        line-height: 1.45;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    #hud h1 {
        margin: 0 0 8px 0;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #ffdb45;
    }

    #hud label {
        display: block;
        margin-bottom: 6px;
    }

    #speedSlider {
        width: 100%;
        margin: 0 0 10px 0;
        cursor: pointer;
    }

    #status {
        font-size: 12px;
        color: #b9c4d0;
    }

    #hint {
        margin-top: 8px;
        font-size: 11px;
        color: #7f8b99;
    }
</style>
</head>
<body>
    <div id="hud">
        <h1>Elevator Simulation</h1>
        <label for="speedSlider">Animation speed: <span id="speedValue">1x</span></label>
        <input id="speedSlider" type="range" min="1" max="20" step="1" value="1">
        <div id="status">Simulation starting...</div>
        <div id="hint">Drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>
    </div>

    <!-- 1. Core Three.js library first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

    <!-- 2. OrbitControls depends on the global THREE object -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 3. Custom scripts last -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
