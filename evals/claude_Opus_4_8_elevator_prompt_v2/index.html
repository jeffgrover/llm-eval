<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Elevator Simulation</title>
    <!-- Empty favicon to avoid a spurious /favicon.ico 404 in the console. -->
    <link rel="icon" href="data:,">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #dfe9f3;
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        }
        #ui {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            user-select: none;
        }
        #ui label { display: block; margin-bottom: 8px; }
        #speedSlider { width: 200px; vertical-align: middle; cursor: pointer; }
        #title {
            position: absolute;
            top: 12px;
            right: 16px;
            z-index: 10;
            color: #2c3e50;
            font-size: 13px;
            text-align: right;
        }
    </style>
</head>
<body>
    <!-- Speed control (1x - 20x). All 3D content is generated by the scripts. -->
    <div id="ui">
        <label>Animation Speed: <span id="speedValue">1x</span></label>
        <input id="speedSlider" type="range" min="1" max="20" step="1" value="1">
    </div>
    <div id="title">3D Elevator Simulation<br>drag to orbit &middot; scroll to zoom</div>

    <!-- 1. Load the core Three.js library first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- 2. Load OrbitControls, which depends on the core library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 3. Load custom scripts last (person.js before elevator.js) -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
