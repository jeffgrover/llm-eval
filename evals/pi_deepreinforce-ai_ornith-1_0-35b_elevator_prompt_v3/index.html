<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Elevator Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #speed-control {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
        
        #speed-control label {
            margin-right: 10px;
            font-weight: bold;
        }
        
        #speed-slider {
            width: 150px;
        }
    </style>
</head>
<body>
    <div id="speed-control">
        <label for="speed-slider">Speed:</label>
        <input type="range" id="speed-slider" min="1" max="20" value="1" step="1">
        <span id="speed-value">1x</span>
    </div>

    <!-- Load Three.js first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    
    <!-- Load OrbitControls second -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Load custom scripts last -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>
    
    <script>
        // Speed slider control
        const speedSlider = document.getElementById('speed-slider');
        const speedValue = document.getElementById('speed-value');
        
        speedSlider.addEventListener('input', function() {
            simClock.speed = parseFloat(this.value);
            speedValue.textContent = this.value + 'x';
        });
    </script>
</body>
</html>
