<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; }
        #speed-control { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 10; 
            color: white; 
            font-family: sans-serif; 
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="speed-control">
        <label for="speedSlider">Animation Speed: <span id="speedValue">1x</span></label>
        <input type="range" id="speedSlider" min="1" max="20" value="1">
    </div>

    <!-- 1. Load the core Three.js library first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- 2. Load OrbitControls, which depends on the core library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 3. Load your custom scripts last -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
