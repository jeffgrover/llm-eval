<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #speed-control {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: rgba(0,0,0,0.6); color: white; padding: 8px 12px;
            border-radius: 6px; font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="speed-control">Speed: <input type="range" id="speedSlider" min="1" max="20" value="1"> <span id="speedVal">1x</span></div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
