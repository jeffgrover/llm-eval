<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #speedControl { position: absolute; top: 10px; left: 10px; z-index: 100; }
        #speedSlider { width: 150px; }
        #speedLabel { color: white; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="speedControl">
        <label id="speedLabel">Speed: 1x</label><br>
        <input type="range" id="speedSlider" min="1" max="20" value="1" step="0.5">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
