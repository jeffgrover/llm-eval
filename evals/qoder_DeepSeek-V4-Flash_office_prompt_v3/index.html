<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Office Building Simulation</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#222233}canvas{display:block}#hud{position:absolute;top:10px;left:10px;color:#fff;font-family:monospace;font-size:14px;background:rgba(0,0,0,0.6);padding:12px 16px;border-radius:6px;pointer-events:none;user-select:none;z-index:10;min-width:280px;line-height:1.5}#hud .controls{pointer-events:auto;margin-top:8px}#hud label{display:block;margin:4px 0;font-size:12px;color:#ccc}#hud input[type=range]{width:100%;margin:2px 0}</style>
</head><body>
<div id="hud"><div id="clockDisplay">--:-- --</div><div class="controls"><label>Speed: <span id="speedLabel">120x</span><input type="range" id="speedSlider" min="0" max="100" value="68"></label><label>Occupancy: <span id="occLabel">45 / 100</span><input type="range" id="occSlider" min="1" max="100" value="45"></label></div><div id="stateInfo" style="font-size:11px;margin-top:6px;color:#aaa;"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="person.js"></script>
<script src="world.js"></script>
<script src="elevator_logic.js"></script>
<script src="elevator.js"></script>
<script src="sim.js"></script>
</body></html>
