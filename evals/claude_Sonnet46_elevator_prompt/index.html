<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Elevator Simulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; overflow: hidden; font-family: Arial, sans-serif; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            z-index: 100;
            min-width: 200px;
        }
        #controls h3 { margin-bottom: 10px; font-size: 14px; color: #aaf; }
        #controls label { font-size: 12px; display: block; margin-bottom: 4px; }
        #speedSlider { width: 100%; cursor: pointer; }
        #speedValue { font-weight: bold; color: #ff0; }
        #status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: #ccc;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>Elevator Simulation</h3>
        <label>Speed: <span id="speedValue">1x</span></label>
        <input type="range" id="speedSlider" min="1" max="20" value="1" step="0.5">
    </div>
    <div id="status">Initializing...</div>

    <!-- 1. Load the core Three.js library first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- 2. Load OrbitControls, which depends on the core library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 3. Load your custom scripts last -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
