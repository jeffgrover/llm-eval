<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Elevator Simulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #111; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        #controls label { display: block; margin-bottom: 6px; }
        input[type=range] { width: 200px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="controls">
        <label>Speed: <span id="speedLabel">1.0x</span></label>
        <input type="range" id="speedSlider" min="1" max="20" value="1" step="0.5">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
