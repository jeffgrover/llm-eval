<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #20242a; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: auto;
        }
        #speed-control { width: 150px; }
    </style>
</head>
<body>
    <div id="ui">
        <div>Simulation Speed: <span id="speed-val">1</span>x</div>
        <input type="range" id="speed-control" min="1" max="20" value="1" step="1">
    </div>

    <!-- 1. Load the core Three.js library first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

    <!-- 2. Load OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 3. Load custom scripts -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
