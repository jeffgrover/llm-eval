<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: auto;
        }
        .control-group { margin-bottom: 10px; }
        label { display: inline-block; width: 120px; }
        #status { margin-top: 10px; font-size: 0.9em; color: #aaa; }
    </style>
</head>
<body>
    <div id="controls">
        <div class="control-group">
            <label for="speed-slider">Simulation Speed:</label>
            <input type="range" id="speed-slider" min="1" max="20" value="1" step="0.5">
            <span id="speed-value">1x</span>
        </div>
        <div id="status">Initializing...</div>
    </div>

    <!-- 1. Load the core Three.js library first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- 2. Load OrbitControls, which depends on the core library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 3. Load your custom scripts last -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
