<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
    </style>
</head>

    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
