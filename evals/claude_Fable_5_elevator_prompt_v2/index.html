<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Elevator Simulation</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #2b3a55 0%, #141b2d 70%);
    }
    canvas { display: block; }
    #speedControl {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      user-select: none;
    }
    #speedControl input[type="range"] {
      width: 180px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <!-- Speed control (read by elevator.js) -->
  <div id="speedControl">
    <label for="speedSlider">Animation speed: <span id="speedValue">1x</span></label><br>
    <input type="range" id="speedSlider" min="1" max="20" step="1" value="1">
  </div>

  <!-- 1. Core Three.js library first -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <!-- 2. OrbitControls, which depends on the global THREE -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- 3. Custom scripts last -->
  <script src="person.js"></script>
  <script src="elevator.js"></script>
</body>
</html>
