<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Elevator Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #20242a;
        }
        #ui-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(20, 24, 32, 0.85);
            color: #e8e8e8;
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 8px;
            user-select: none;
        }
        #ui-panel label {
            display: block;
            margin-bottom: 4px;
        }
        #speed-slider {
            width: 160px;
            vertical-align: middle;
        }
        #speed-value {
            display: inline-block;
            min-width: 34px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="ui-panel">
        <label for="speed-slider">Simulation speed: <span id="speed-value">1x</span></label>
        <input type="range" id="speed-slider" min="1" max="20" step="1" value="1">
    </div>

    <!-- 1. Load the core Three.js library first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

    <!-- 2. Load OrbitControls, which depends on the core library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 3. Load your custom scripts last -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
