<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            color: white;
            z-index: 100;
        }
        #controls label { display: block; margin-bottom: 5px; }
        #controls input[type="range"] { width: 200px; }
    </style>
</head>
<body>
    <div id="controls">
        <label>Simulation Speed: <span id="speedValue">1x</span></label>
        <input type="range" id="speedSlider" min="1" max="20" value="1" step="1">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
