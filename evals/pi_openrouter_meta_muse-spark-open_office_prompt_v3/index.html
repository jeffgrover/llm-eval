<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Office Building Simulation</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#222233}canvas{display:block}
#hud{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.75);color:#eee;padding:12px 14px;border-radius:8px;font-family:monospace;font-size:12px;min-width:260px;max-width:320px;z-index:10}
#hud h3{margin:0 0 6px 0;font-size:15px}
#hud label{display:block;margin:4px 0}
#hud input[type=range]{width:100%}
</style>
</head><body>
<div id="hud">
<h3 id="timeDisplay"> 7:30 AM</h3>
<label>Speed: <span id="speedLabel">120x</span><input type="range" id="speedSlider" min="0" max="6" step="1" value="3"></label>
<label>Occupancy: <span id="occLabel">45 / 100</span><input type="range" id="occSlider" min="1" max="100" step="1" value="45"></label>
<div id="stats"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="person.js"></script>
<script src="world.js"></script>
<script src="elevator_logic.js"></script>
<script src="elevator.js"></script>
<script src="sim.js"></script>
</body></html>
