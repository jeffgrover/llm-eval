<!DOCTYPE html>
<html>
<head>
    <title>3D Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <!-- Speed slider for animation control -->
    <div id="controls" style="position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif;">
        <label for="speedSlider">Speed:</label>
        <input type="range" id="speedSlider" min="1" max="20" value="1">
    </div>

    <!-- 1. Core Three.js library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- 2. OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 3. Custom scripts (Person first, then Elevator) -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
