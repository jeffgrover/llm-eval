<!DOCTYPE html>
<html>
<head>
    <title>3D Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #speed-control {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: white;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="speed-control">
        Animation Speed: <input type="range" id="speedSlider" min="1" max="20" value="3">
    </div>

    <!-- 1. Load the core Three.js library first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- 2. Load OrbitControls, which depends on the core library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 3. Load your custom scripts last -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
