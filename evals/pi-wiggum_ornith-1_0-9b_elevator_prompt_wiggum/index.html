<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elevator Simulation</title>
<style>
    body { margin: 0; background: #1a1a2e; overflow: hidden; }
    canvas { display: block; }
    #controls {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
        color: #fff; font-family: sans-serif; z-index: 10; text-align: center;
    }
    input[type=range] { width: 200px; margin: 0 10px; cursor: pointer; }
    label { display: inline-block; }
</style>
</head>
<body>
<div id="controls">
    <label>Speed:
        <input type="range" min="1" max="20" value="1" step="1" id="speedSlider">
    </label>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="person.js"></script>
<script src="elevator.js"></script>
</body>
</html>
