<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elevator Simulation</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #111111; overflow: hidden; }
    #speed-control {
      position: absolute; top: 10px; left: 10px;
      color: #ffffff; font-family: sans-serif; font-size: 14px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="speed-control">
    Speed: <input type="range" id="speed-slider" min="1" max="20" value="1"> <span id="speed-label">1x</span>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="person.js"></script>
  <script src="elevator.js"></script>
</body>
</html>
