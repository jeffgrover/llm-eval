<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="controls">
        Speed Multiplier: <input type="range" id="speedSlider" min="1" max="20" value="1"> (1x)
    </div>

    <!-- 1. Load the core Three.js library first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- 2. Load OrbitControls, which depends on the core library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 3. Load your custom scripts last -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
