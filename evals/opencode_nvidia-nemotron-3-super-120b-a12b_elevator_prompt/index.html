<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #speedSliderContainer {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
        #speedLabel {
            position: fixed;
            top: 20px;
            left: 150px;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="speedSliderContainer">
        <label for="speedSlider">Animation Speed: </label>
        <input type="range" id="speedSlider" min="1" max="20" value="1">
        <span id="speedLabel">1x</span>
    </div>
    
    <!-- 1. Load the core Three.js library first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    
    <!-- 2. Load OrbitControls, which depends on the core library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- 3. Load your custom scripts last -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
