<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Small Hours — Office Building Simulation</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { margin: 0; padding: 0; overflow: hidden; background: #222233; width: 100%; height: 100%; }
    canvas { display: block; }
    #hud { position: fixed; left: 18px; top: 18px; width: 294px; box-sizing: border-box; padding: 16px 17px 15px; color: #f4f7fb; background: rgba(13, 18, 27, .84); border: 1px solid rgba(255,255,255,.17); border-radius: 14px; box-shadow: 0 12px 36px rgba(0,0,0,.32); backdrop-filter: blur(10px); user-select: none; z-index: 5; }
    #hud .eyebrow { color: #8fa9bd; font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    #sim-time { margin: 2px 0 9px; color: #ffcb67; font-size: 32px; line-height: 1.05; font-variant-numeric: tabular-nums; font-weight: 750; letter-spacing: -.03em; text-shadow: 0 0 18px rgba(255,187,34,.25); }
    #hud label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 9px; color: #c9d3dd; font-size: 11px; }
    #hud label output { color: #fff; font-weight: 750; font-variant-numeric: tabular-nums; }
    #hud input[type="range"] { width: 100%; height: 18px; margin: 2px 0 1px; accent-color: #f1b84b; cursor: pointer; }
    #hud .rule { height: 1px; margin: 11px 0 9px; background: rgba(255,255,255,.11); }
    #elevator-readout { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; color: #aebbc7; font-size: 10px; line-height: 1.35; }
    #elevator-readout b { color: #f1f5f8; font-weight: 650; text-align: right; overflow-wrap: anywhere; }
    #state-breakdown { margin-top: 9px; color: #9fadb9; font-size: 9px; line-height: 1.45; }
    #hint { position: fixed; right: 18px; bottom: 15px; padding: 8px 11px; color: rgba(238,244,249,.72); background: rgba(13,18,27,.58); border: 1px solid rgba(255,255,255,.1); border-radius: 9px; font-size: 10px; letter-spacing: .02em; pointer-events: none; }
    @media (max-width: 700px) { #hud { left: 10px; top: 10px; width: 265px; padding: 12px 13px; } #sim-time { font-size: 27px; } #hint { display: none; } }
  </style>
</head>
<body>
<div id="hud" aria-live="polite">
  <div class="eyebrow">Small Hours · Live Office</div>
  <div id="sim-time"> 7:30 AM</div>
  <label for="speed-slider"><span>Clock speed</span><output id="speed-value">120× realtime</output></label>
  <input id="speed-slider" type="range" min="0" max="13" value="8" step="1" aria-label="Simulation speed">
  <label for="occupancy-slider"><span>Occupancy</span><output id="occupancy-value">45 / 100 people</output></label>
  <input id="occupancy-slider" type="range" min="1" max="100" value="45" step="1" aria-label="Target office occupancy">
  <div class="rule"></div>
  <div id="elevator-readout"></div>
  <div id="state-breakdown"></div>
</div>
<div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="person.js"></script>
<script src="world.js"></script>
<script src="elevator_logic.js"></script>
<script src="elevator.js"></script>
<script src="sim.js"></script>
</body>
</html>
