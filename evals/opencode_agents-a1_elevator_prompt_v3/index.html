<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Elevator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #speed-control {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
        #speed-control label { margin-right: 10px; }
        #speed-slider { width: 150px; }
    </style>
</head>
<body>
    <div id="speed-control">
        <label for="speed-slider">Animation Speed: <span id="speed-value">1x</span></label>
        <input type="range" id="speed-slider" min="1" max="20" value="1" step="1">
    </div>

    <!-- Load Three.js first -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <!-- Load OrbitControls second -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Load custom scripts last (no type="module") -->
    <script src="person.js"></script>
    <script src="elevator.js"></script>
</body>
</html>
